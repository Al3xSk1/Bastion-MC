# bastion-mc configuration — copy to ~/.config/bastion-mc/config.toml (mode 0600).
# Every value shown is the default unless marked otherwise. Unknown keys are errors.

[auth]
# REQUIRED for signing in. The Application (client) ID of YOUR OWN Azure app registration.
# There is no built-in ID. See README.md, "Your own OAuth application".
# client_id = "00000000-0000-0000-0000-000000000000"
flow = "pkce"              # "pkce" (browser + loopback redirect) | "device" (code on another device)
token_store = "keyutils"   # "keyutils" (kernel keyring, RAM only) | "age" | "none"
allow_game_pass = false    # accept accounts licensed through Xbox Game Pass
# Profile canary: the account's name, skin and cape are pinned at sign-in and compared at
# every launch. A change that was not made through this launcher (`skin set`, `cape set`):
canary = "enforce"         # "enforce" (refuse to launch until `bastion-mc canary accept`) | "warn" | "off"
canary_wipe = false        # on a mismatch also delete that account's stored refresh token

# [auth.age]               # only for token_store = "age"
# program = "/usr/bin/age"
# recipients_file = "/home/you/.config/bastion-mc/age-recipients.txt"
# identity_file = "/home/you/.config/bastion-mc/age-identity.txt"   # e.g. an age-plugin-yubikey stub
# The recipients decide to whom every new vault file is encrypted, and encrypting needs no
# device: a recipients file of your own can be extended by any program running as you. If
# the root-owned file /etc/bastion-mc/age-recipients exists it is used instead of every
# recipients_file here, and token_store = "keyutils" is refused (`bastion-mc doctor` says
# which case applies).
# Keys of their own for single accounts (`--account work`); others use the two files above.
# [auth.age.accounts.work]
# recipients_file = "/home/you/.config/bastion-mc/work-recipients.txt"
# identity_file = "/home/you/.config/bastion-mc/work-identity.txt"

[launcher]
# Once the game runs the launcher gives up, on all its threads, everything it no longer
# needs: files outside the instance's persist/ directory and the cache, running programs,
# most of the network (Landlock), and the kernel keyring (a system-call filter). All of it
# needs Landlock ABI 9; on an older kernel "auto" applies what it can and says what is
# missing, "require" refuses to launch. `bastion-mc doctor` says which this machine is.
confine = "auto"           # "auto" | "require" | "off"

[tls]
# Pin Microsoft/Mojang hosts to the root and intermediate keys those services chain to
# (built into the launcher). Turn off only if Microsoft has moved to a new root and the
# launcher has not caught up yet.
builtin_pins = true
# Additional SPKI pins. Key: exact host, or ".suffix". A pinned host is accepted only if a
# certificate in the chain that actually validated carries one of these keys. An entry here
# replaces the built-in pins for the same pattern.
# [tls.pins]
# "piston-meta.mojang.com" = ["sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="]

[java]
match = "exact"            # "exact": the Java release the game declares | "newer": lowest installed release >= it
memory_mb = 4096
allow_serialization = false
# home = "/usr/lib/jvm/java-21-openjdk"   # must be a root-owned runtime under /usr/lib/jvm

[sandbox]
display = "auto"           # "auto" | "wayland" | "x11"
allow_x11 = false          # hand the game the session's own X11 display (no isolation between X clients):
                           # only needed on X11 without gamescope; accepts a sandbox-escape path
# On X11: run the game inside a nested compositor (gamescope, in a sandbox of its own), so
# that it gets a display server to itself. gamescope's clipboard bridge is cut by a library
# the launcher loads into it; that library reports from inside the compositor, and without
# its report "auto" says that the clipboard is not known to be cut and "require" refuses.
nested_compositor = "auto" # "auto" (when gamescope is installed) | "require" | "off"
nested_compositor_args = []          # extra gamescope options, e.g. ["-W", "1920", "-H", "1080", "-f"]
# On Wayland: a socket of the game's own that the compositor knows to be a sandbox
# (wp_security_context_v1). What the compositor then offers on that socket is its decision;
# the launcher lists it, and if screen capture, input injection or a clipboard manager is
# still on offer, "auto" says so and "require" refuses.
wayland_security_context = "auto"    # "auto" (when the compositor supports it) | "require" | "off"
audio = "pulse"            # "pulse" | "alsa" | "none"
allow_pulse_module_loading = false   # expose the audio socket even if the sound server lets clients load modules into it
gpu = true
seccomp = "enforce"        # "enforce" | "log" (diagnostics only: violations are logged, then allowed)
tripwire = true            # SIGSYS-kill on exploit-only syscalls (ptrace, bpf, mount, …)
expose_timezone = false
exec_allow = []            # extra executables the JVM may execve (absolute paths)
extra_syscalls = []        # extra syscall names for the allowlist
# Carried into the session and back by the launcher. Never copied: each file is parsed
# against the grammar of its kind and written out again, in both directions. Between
# sessions they rest in the instance's persist/ directory.
persist_files = ["options.txt", "servers.dat"]
extra_rw_dirs = []         # e.g. ["screenshots"]; not mods, resourcepacks, shaderpacks (see `bastion-mc pack`) or persist
tmp_size_mb = 1024
# Resource limits through a transient systemd scope: memory ceiling, no swap, task count.
# The limits are read back from the kernel once the game runs; if they are not in force,
# "auto" says so and "require" stops the launch.
cgroup = "auto"            # "auto" (when a systemd user manager is there) | "require" | "off"
# memory_max_mb = 10240    # default: 2 x java.memory_mb + tmp_size_mb + 1024
tasks_max = 4096
# cpu_quota_percent = 400  # CPU time ceiling in percent of one CPU (400 = four CPUs); default: none

[network]
mode = "filtered"          # "filtered" | "open" | "none"
service_domains = ["minecraft.net", "mojang.com", "minecraftservices.com"]
texture_gateway = true
servers = []               # e.g. ["play.example.org", "203.0.113.7:25570", { host = "lan-box", allow_private = true }]
# Voice chat (Simple Voice Chat and similar mods send UDP to a port of the game server): name
# that port in the server's rule, e.g.
#   servers = [{ host = "play.example.org", voice = 24454 }]       # or: udp = [24454, 24455]
# The launcher then relays datagrams to that port of that server — only while a game
# connection to it is open, only to the address that connection uses, at most 1400 bytes
# each and at a voice-sized rate. Ports from 1024 up, at most 4 per server. A rule without
# `voice`/`udp` allows no UDP, and there is no switch that allows it for all servers.
# Send everything that goes to Microsoft and Mojang through a SOCKS5 proxy that also
# resolves the names, e.g. Tor: sign-in, downloads, and while the game runs what the broker
# forwards, skin textures and the game's own HTTPS connections to Mojang's services.
# NOT proxied: connections to multiplayer servers, the lookup of their names (your resolver
# sees those), and UDP voice. Those come from your address. (With mode = "open" nothing the
# game sends is proxied: it then connects to Mojang directly, too.)
# launcher_proxy = "socks5h://127.0.0.1:9050"

# Credential broker (filtered mode): the game is given a placeholder instead of the access
# token; the launcher terminates the game's HTTPS to Mojang's API and attaches the real
# token only to the kinds of request switched on here. Skin, cape and name changes are
# never possible from the game, whatever is set.
[network.broker]
enabled = true
join = true                # prove your identity to a server you connect to (online-mode multiplayer)
chat_signing = true        # fetch the chat-signing key pair
account_read = true        # read privileges, ban status, block list
friends = false
settings = false           # change account preferences
reports = false            # send player reports
telemetry = false
extra_token_endpoints = [] # "METHOD host/path", for game versions newer than this launcher

[downloads]
extra_hosts = []
verify_assets_on_launch = true
parallel = 8

# The companion mod: the phone, the home screen, dark menus, zoom and a few other
# conveniences, built into the launcher and added to Fabric profiles for the session
# (Minecraft 1.20.1, 1.20.4, 1.21.1, 1.21.4, 1.21.5, 1.21.8, 1.21.10, 26.1.2, 26.2, 26.3; the
# other versions from 1.20.1 to 26.3 with force; zoom, hud and fullbright on 26.3 only; the
# signed mods directory is not touched). It enforces nothing. An instance can set any of these
# keys for itself under [companion] in its instance.toml.
[companion]
enabled = true
force = false              # also add it for Minecraft versions it was not tested with
zoom = true                # hold the key to zoom; the mouse wheel changes the factor meanwhile
zoom_key = "key.keyboard.c"   # a keyboard key by Minecraft's name for it (see options.txt); "c" works too
zoom_factor = 4.0          # 1.1 to 50: the field of view is divided by this
zoom_wheel = true
hud = false                # frames per second, position and facing in a corner
fullbright = false         # brighten dark places. Some servers do not allow this.
fullbright_gamma = 15.0    # 1 to 100; the game's own brightness slider ends at 1
phone = true               # the in-game phone (Spotify, the browser, clips, Realms, settings)
phone_key = "key.keyboard.r"   # pulls the phone out and puts it away
home = true                # the redone home (title) screen
dark_menus = true          # darker backgrounds behind the game's own menus

# Realms in the filtered network. Off by default: Realms joins are refused, as they always
# were. With "code" or "totp" the credential broker also answers for the Realms hosts (your
# Realms list, invitations, notifications — nothing an owner does to a Realm), and a join
# waits for your approval outside the game:
#   "code"  the launcher shows a six-digit code (in its own output and in the front end, never
#           in the game); type it into the phone's Realms app. 120 s, 3 attempts.
#   "totp"  type the code of your authenticator app instead (`bastion-mc realms totp-setup`).
# Only then does the game get to connect, once, to the server Realms named. Needs an account,
# the filtered network with the broker, and the phone (a Fabric instance with the companion).
[realms]
approve = "off"            # "off", "code" or "totp"

# Settings sync: video, sound volumes, mouse, key bindings, language, chat and accessibility
# settings follow you from instance to instance (translated between Minecraft versions where
# the format changed). Never per-world or per-server settings, never the resource packs. The
# companion's own settings come from this file anyway ([companion] above).
[sync]
options = true
