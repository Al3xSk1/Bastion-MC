<!-- labels and sentences, in the sans stack -->
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif">
<g font-size="11" fill="#9bb0bd" letter-spacing="1.4" font-weight="600">
<text x="46" y="19">NETWORK</text>
<text x="312" y="79.5" text-anchor="end">HOST · YOUR UID</text>
</g>
<g font-size="11.5" fill="#9bb0bd">
<text x="46" y="34">the game has no route to it: the launcher</text>
<text x="46" y="49">holds the only sockets that lead out</text>
<text x="104" y="124.5">a separate process: starts the</text>
<text x="104" y="139.5">launcher, reads its progress</text>
<text x="104" y="154.5">events, holds no token</text>
<text x="300" y="201.5" text-anchor="end">trusted computing base</text>
<text x="28" y="281.5">tokens in locked, self-wiping memory</text>
<text x="28" y="329.5">every file hashed, then bound in</text>
<text x="28" y="344.5">by the descriptor that was hashed</text>
<text x="28" y="392.5">hold the only sockets</text>
<text x="28" y="407.5">that lead out</text>
<text x="28" y="455.5">holds the access token</text>
<text x="28" y="470.5">outside the game</text>
<text x="28" y="518.5">sanitises every byte</text>
<text x="28" y="533.5">from the sandbox</text>
<text x="28" y="581.5">over fd 0, an AF_UNIX</text>
<text x="28" y="596.5">socketpair</text>
<text x="52" y="987.5">by default: a placeholder,</text>
<text x="52" y="1002.5">not the access token</text>
<text x="88" y="1335.5">the game's own: security context</text>
<text x="88" y="1350.5">or nested compositor</text>
<text x="88" y="1389.5">with audio = "pulse"</text>
<text x="88" y="1430.5">and its sysfs directory</text>
</g>
<g font-size="10.5" fill="#9bb0bd" letter-spacing="1.3" font-weight="600">
<text x="104" y="108.5">FRONT END</text>
<text x="52" y="1033.5">ROOT</text>
<text x="52" y="1084.5">WRITABLE</text>
<text x="52" y="1135.5">READ-ONLY</text>
<text x="52" y="1186.5">NETWORK</text>
</g>
<g font-size="11" fill="#3fd9e6" letter-spacing="1.4" font-weight="600">
<text x="28" y="201.5">LAUNCHER</text>
<text x="28" y="711">SYSTEMD SCOPE</text>
<text x="34" y="757">NAMESPACES</text>
<text x="40" y="818">LANDLOCK</text>
<text x="46" y="864">SECCOMP</text>
</g>
<g font-size="12" fill="#dbe6ec">
<text x="28" y="627.5">before it reads anything from the game,</text>
<text x="28" y="642.5">it confines itself</text>
</g>
<g font-size="11" fill="#ff5f56" letter-spacing="1.4" font-weight="600">
<text x="52" y="912.5">THE GAME · JVM</text>
</g>
<g font-size="13.5" fill="#f2f7f9">
<text x="52" y="951.5">Treated as hostile from</text>
<text x="52" y="968.5">its first instruction</text>
</g>
<g font-size="11" fill="#f5b041" letter-spacing="1.4" font-weight="600">
<text x="88" y="1296.5">DELIBERATE HOLES</text>
<text x="88" y="1319.5">1 DISPLAY SOCKET</text>
<text x="88" y="1373.5">1 AUDIO SOCKET</text>
</g>
</g>
<!-- values, in the monospace stack -->
<g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'JetBrains Mono', 'Adwaita Mono', 'DejaVu Sans Mono', 'Noto Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace">
<g font-size="11.5" fill="#9bb0bd">
<text x="302" y="108.5" text-anchor="end">optional</text>
<text x="28" y="219.5">non-dumpable · no_new_privs ·</text>
<text x="28" y="234.5">RLIMIT_CORE=1</text>
<text x="28" y="727">memory · no swap · task limit</text>
<text x="34" y="773">user → user → pid ipc uts cgroup</text>
<text x="34" y="788">mount net</text>
<text x="40" y="834">only the listed trees</text>
<text x="46" y="880">allowlist + tripwire</text>
</g>
<g font-size="12" fill="#f2f7f9">
<text x="28" y="265.5">auth</text>
<text x="28" y="313.5">verified store</text>
<text x="28" y="376.5">egress relay + DNS responder</text>
<text x="28" y="439.5">credential broker</text>
<text x="28" y="502.5">log relay</text>
<text x="28" y="565.5">launch frame</text>
</g>
<g font-size="11" fill="#9bb0bd">
<text x="300" y="265.5" text-anchor="end">MSA → XBL → XSTS → MC</text>
<text x="28" y="657.5">(Landlock + seccomp, all threads)</text>
<text x="52" y="928.5">bwrap → init stage → JVM</text>
</g>
<g font-size="11" fill="#dbe6ec">
<text x="52" y="1049.5">empty tmpfs "/" · /usr read-only</text>
<text x="52" y="1064.5">synthetic /etc, fresh /proc /dev</text>
<text x="52" y="1100.5">/game (scratch) + saves/ logs/</text>
<text x="52" y="1115.5">config/ of ONE instance</text>
<text x="52" y="1151.5">mods/ resourcepacks/ shaderpacks/</text>
<text x="52" y="1166.5">verified files, sealed tmpfs</text>
<text x="52" y="1202.5">no route</text>
</g>
<g font-size="12.5" fill="#f5b041">
<text x="88" y="1414.5">/dev/dri</text>
</g>
</g>
</svg>
