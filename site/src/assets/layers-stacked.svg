<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 1453" width="328" height="1453">
<title>The trust boundaries of bastion-mc</title>
<desc>On the host, under your user: the launcher, which is the trusted part and holds the tokens and the only sockets that lead out; and the game, treated as hostile, inside a systemd scope, namespaces, Landlock and a seccomp filter. Three deliberate holes lead from the game to the desktop: one display socket, one audio socket (with audio = "pulse") and the graphics device.</desc>
