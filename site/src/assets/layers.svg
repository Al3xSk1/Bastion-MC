<path fill="#3fd9e6" d="M511 420l-7 -3.85v7.7z"/>
<circle cx="410.5" cy="420" r="3" fill="#3fd9e6"/>
<!-- the deliberate holes: from the game through every layer to the desktop -->
<circle cx="560" cy="432" r="3.5" fill="#1e1416" stroke="#f5b041" stroke-width="1.5"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M560 435.5V512"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M560 512h10M560 512h-10"/>
<circle cx="704" cy="432" r="3.5" fill="#1e1416" stroke="#f5b041" stroke-width="1.5"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M704 435.5V512"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M704 512h10M704 512h-10"/>
<circle cx="846" cy="432" r="3.5" fill="#1e1416" stroke="#f5b041" stroke-width="1.5"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M846 435.5V512"/>
<path fill="none" stroke="#f5b041" stroke-width="2" d="M846 512h10M846 512h-10"/>
<!-- the graphical front end: not part of the trusted base -->
<path fill="none" stroke="#556c7e" stroke-dasharray="3 3" d="M70.5 490.5V520.5"/>
<path fill="#05080a" stroke="#33485a" d="M38.5 520.5H300.5V572.5L292.5 580.5H30.5V528.5Z"/>
<!-- labels and sentences, in the sans stack -->
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif">
<g font-size="11" fill="#9bb0bd" letter-spacing="1.4" font-weight="600">
<text x="88" y="22">NETWORK</text>
<text x="932" y="67" text-anchor="end">HOST · YOUR UID</text>
</g>
<g font-size="12" fill="#9bb0bd">
<text x="88" y="37">the game has no route to it: the launcher holds the only sockets that lead out</text>
<text x="46" y="174">tokens in locked, self-wiping memory</text>
<text x="46" y="226">every file hashed, bound in by that descriptor</text>
<text x="46" y="278">hold the only sockets that lead out</text>
<text x="46" y="330">holds the access token outside the game</text>
<text x="46" y="382">sanitises every byte from the sandbox</text>
<text x="46" y="434">over fd 0, an AF_UNIX socketpair</text>
<text x="528" y="258">by default: a placeholder, not the access token</text>
</g>
<g font-size="11" fill="#3fd9e6" letter-spacing="1.4" font-weight="600">
<text x="46" y="101">LAUNCHER · TRUSTED COMPUTING BASE</text>
<text x="482.5" y="97">SYSTEMD SCOPE</text>
<text x="492.5" y="125">NAMESPACES</text>
<text x="502.5" y="153">LANDLOCK</text>
<text x="512.5" y="181">SECCOMP</text>
</g>
<g font-size="12" fill="#dbe6ec">
<text x="46" y="465">before it reads anything from the game, it confines itself</text>
</g>
<g font-size="11" fill="#ff5f56" letter-spacing="1.4" font-weight="600">
<text x="528" y="215">THE GAME · JVM</text>
</g>
<g font-size="13" fill="#f2f7f9">
<text x="528" y="239">Treated as hostile from its first instruction</text>
</g>
<g font-size="10.5" fill="#9bb0bd" letter-spacing="1.3" font-weight="600">
<text x="528" y="292">ROOT</text>
<text x="528" y="331">WRITABLE</text>
<text x="528" y="370">READ-ONLY</text>
<text x="528" y="409">NETWORK</text>
<text x="44" y="539">FRONT END</text>
</g>
<g font-size="11" fill="#f5b041" letter-spacing="1.4" font-weight="600">
<text x="456" y="527" text-anchor="end">DELIBERATE</text>
<text x="456" y="542" text-anchor="end">HOLES</text>
<text x="560" y="531" text-anchor="middle">1 DISPLAY SOCKET</text>
<text x="704" y="531" text-anchor="middle">1 AUDIO SOCKET</text>
</g>
<g font-size="11.5" fill="#9bb0bd">
<text x="560" y="548" text-anchor="middle">the game's own:</text>
<text x="560" y="563" text-anchor="middle">security context</text>
<text x="560" y="578" text-anchor="middle">or nested compositor</text>
<text x="704" y="548" text-anchor="middle">with audio = "pulse"</text>
<text x="846" y="548" text-anchor="middle">and its sysfs directory</text>
<text x="44" y="555">a separate process: starts the launcher,</text>
<text x="44" y="570">reads its events, holds no token</text>
</g>
</g>
<!-- values, in the monospace stack -->
<g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'JetBrains Mono', 'Adwaita Mono', 'DejaVu Sans Mono', 'Noto Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace">
<g font-size="12" fill="#9bb0bd">
<text x="46" y="121">non-dumpable · no_new_privs · RLIMIT_CORE=1</text>
</g>
<g font-size="13" fill="#f2f7f9">
<text x="46" y="156">auth</text>
<text x="46" y="208">verified store</text>
<text x="46" y="260">egress relay + DNS responder</text>
<text x="46" y="312">credential broker</text>
<text x="46" y="364">log relay</text>
<text x="46" y="416">launch frame</text>
</g>
<g font-size="11.5" fill="#9bb0bd">
<text x="394" y="156" text-anchor="end">MSA → XBL → XSTS → MC</text>
<text x="46" y="481">(Landlock + seccomp, all threads)</text>
<text x="917.5" y="97" text-anchor="end">memory · no swap · task limit</text>
<text x="907.5" y="125" text-anchor="end">user → user → pid ipc uts cgroup mount net</text>
<text x="897.5" y="153" text-anchor="end">only the listed trees</text>
<text x="887.5" y="181" text-anchor="end">allowlist + tripwire</text>
<text x="872" y="215" text-anchor="end">bwrap → init stage → JVM</text>
<text x="287" y="539" text-anchor="end">optional</text>
</g>
<g font-size="12" fill="#dbe6ec">
<text x="624" y="292">empty tmpfs "/" · /usr read-only</text>
<text x="624" y="309">synthetic /etc, fresh /proc /dev</text>
<text x="624" y="331">/game (scratch) + saves/ logs/</text>
<text x="624" y="348">config/ of ONE instance</text>
<text x="624" y="370">mods/ resourcepacks/ shaderpacks/</text>
<text x="624" y="387">verified files, sealed tmpfs</text>
<text x="624" y="409">no route</text>
</g>
<g font-size="12.5" fill="#f5b041">
<text x="846" y="531" text-anchor="middle">/dev/dri</text>
</g>
</g>
</svg>
