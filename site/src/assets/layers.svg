<path fill="none" stroke="#1f2b35" d="M46 290.5H394"/>
<path fill="none" stroke="#1f2b35" d="M46 342.5H394"/>
<path fill="none" stroke="#1f2b35" d="M46 394.5H394"/>
<path fill="none" stroke="#1f2b35" d="M46 446.5H394"/>
<!-- the sandbox: a systemd scope, namespaces, Landlock, seccomp; the three holes are gaps in every edge -->
<path fill="#070b0e" d="M482.5 78.5H929.5V478.5L917.5 490.5H470.5V90.5Z"/>
<path fill="none" stroke="#2a8790" stroke-width="1.25" d="M470.5 490.5V90.5L482.5 78.5H929.5V478.5L917.5 490.5M470.5 490.5H553M567 490.5H697M711 490.5H839M853 490.5H917.5"/>
<path fill="#090e12" d="M490.5 106.5H919.5V470.5L909.5 480.5H480.5V116.5Z"/>
