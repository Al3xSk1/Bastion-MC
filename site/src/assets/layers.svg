<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606">
<title>The trust boundaries of bastion-mc</title>
<desc>On the host, under your user: the launcher, which is the trusted part and holds the tokens and the only sockets that lead out; and the game, treated as hostile, inside a systemd scope, namespaces, Landlock and a seccomp filter. Three deliberate holes lead from the game to the desktop: one display socket, one audio socket (with audio = "pulse") and the graphics device.</desc>
<rect width="960" height="606" fill="#05080a"/>
<!-- the network, outside the host: reached through the launcher only -->
<path fill="none" stroke="#3fd9e6" stroke-width="1.5" d="M70.5 78V19"/>
<path fill="#3fd9e6" d="M70.5 10l-3.85 7h7.7z"/>
<circle cx="70.5" cy="78.5" r="3.5" fill="#3fd9e6"/>
<!-- the host, your UID -->
<path fill="#070a0c" stroke="#33485a" d="M26.5 46.5H949.5V579.5L933.5 595.5H10.5V62.5Z"/>
<!-- the launcher: the trusted computing base -->
