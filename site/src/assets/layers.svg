<path fill="#0b1116" d="M498.5 134.5H909.5V462.5L901.5 470.5H490.5V142.5Z"/>
<path fill="none" stroke="#2a8790" stroke-width="1.25" d="M490.5 470.5V142.5L498.5 134.5H909.5V462.5L901.5 470.5M490.5 470.5H553M567 470.5H697M711 470.5H839M853 470.5H901.5"/>
<path fill="#0d141a" d="M506.5 162.5H899.5V454.5L893.5 460.5H500.5V168.5Z"/>
<path fill="none" stroke="#2a8790" stroke-width="1.25" d="M500.5 460.5V168.5L506.5 162.5H899.5V454.5L893.5 460.5M500.5 460.5H553M567 460.5H697M711 460.5H839M853 460.5H893.5"/>
<!-- the game: hostile from its first instruction -->
<path fill="#1e1416" d="M522.5 192.5H887.5V438.5L877.5 448.5H512.5V202.5Z"/>
<path fill="none" stroke="#c24a44" stroke-width="1.25" d="M512.5 448.5V202.5L522.5 192.5H887.5V438.5L877.5 448.5M512.5 448.5H553M567 448.5H697M711 448.5H839M853 448.5H877.5"/>
