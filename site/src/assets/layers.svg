<path fill="none" stroke="#3fd9e6" stroke-width="2" d="M30.5 110.5V90.5L42.5 78.5H62.5"/>
<path fill="none" stroke="#3fd9e6" stroke-width="2" d="M410.5 478.5L398.5 490.5"/>
