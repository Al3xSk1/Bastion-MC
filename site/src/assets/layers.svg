<!-- what crosses between the launcher and the game: each line belongs to the part it starts at -->
<path fill="none" stroke="#3fd9e6" stroke-width="1.5" d="M410.5 212H512.5"/>
<path fill="#3fd9e6" d="M511 212l-7 -3.85v7.7z"/>
